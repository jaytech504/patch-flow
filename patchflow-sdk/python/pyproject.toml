[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patchflow"
version = "0.1.0"
description = "Autonomous error interception and code patch generation SDK for Python (FastAPI, Flask, Django)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "PatchFlow Team", email = "support@patchflow.dev" }
]
keywords = ["patchflow", "error-tracking", "autonomous-fix", "fastapi", "flask", "django", "ai-agent", "reliability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi", "starlette"]
flask = ["flask"]
django = ["django"]

[tool.setuptools]
py-modules = ["patchflow"]
