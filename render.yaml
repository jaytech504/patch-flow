# render.yaml — PatchFlow deployment configuration
#
# Deploy both services from the Render dashboard:
#   Render Dashboard → New → Blueprint → point at this repo
#
# Sensitive env vars (marked sync: false) must be set manually in the Render
# dashboard under each service's "Environment" tab. They are listed here for
# documentation but their values are never committed.
#
# After setting up:
# 1. Set the custom domain www.patchflow.cloud on the frontend service (Render redirects apex → www).
# 2. Set the custom domain api.patchflow.cloud on the backend service.
# 3. Update your GitHub OAuth App callback URL to https://www.patchflow.cloud/auth/callback
# 4. Set NEXT_PUBLIC_API_URL=https://api.patchflow.cloud on the frontend.
# 5. Set FRONTEND_URL=https://www.patchflow.cloud on the backend.

services:
  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  - type: web
    name: patchflow-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://api.patchflow.cloud
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.patchflow.cloud
      # Optional — set to enable Plausible analytics
      - key: NEXT_PUBLIC_PLAUSIBLE_DOMAIN
        value: www.patchflow.cloud

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    name: patchflow-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://www.patchflow.cloud
      # ── Secrets: set these manually in the Render dashboard ──────────────
      - key: DATABASE_URL
        sync: false   # Aiven PostgreSQL connection string (sslmode=require)
      - key: GEMMA_API_KEY
        sync: false   # Google AI Studio API key
      - key: GITHUB_CLIENT_ID
        sync: false   # GitHub OAuth App client ID
      - key: GITHUB_CLIENT_SECRET
        sync: false   # GitHub OAuth App client secret
      - key: JWT_SECRET
        sync: false   # Random 32+ char string — generate with: openssl rand -hex 32
      - key: LEMON_SQUEEZY_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_STORE_ID
        sync: false
      - key: LEMON_SQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMON_SQUEEZY_PRO_MONTHLY_VARIANT_ID
        sync: false
      - key: LEMON_SQUEEZY_PRO_ANNUAL_VARIANT_ID
        sync: false
      - key: LEMON_SQUEEZY_TEAM_MONTHLY_VARIANT_ID
        sync: false
      - key: LEMON_SQUEEZY_TEAM_ANNUAL_VARIANT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # ── Optional tuning ───────────────────────────────────────────────────
      - key: DB_POOL_SIZE
        value: "4"    # Keep low on Aiven Hobbyist (25 max connections)
      - key: DB_POOL_MAX_OVERFLOW
        value: "4"    # Total max = pool_size + max_overflow = 8 per worker
