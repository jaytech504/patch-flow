services:
  # FastAPI Backend Service (Free Tier)
  - type: web
    name: patchflow-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: patchflow-db
          property: connectionString
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://patchflow-frontend-n23j.onrender.com

  # Next.js Frontend Service (Free Tier)
  - type: web
    name: patchflow-frontend
    env: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://patchflow-backend.onrender.com

databases:
  # Managed PostgreSQL Database (Free Tier)
  - name: patchflow-db
    databaseName: chaos_agent
    plan: free
    region: oregon
